nameOverride: svc-auth

replicaCount: 1

imagePullSecrets:
  - name: regcred

image:
  repository: registry.leultewolde.com/mereb/svc-auth
  env:
    - name: NODE_ENV
      value: production
    - name: SERVICE_NAME
      value: svc-auth
  envFrom:
    - configMapRef:
        name: svc-auth-dev-config
    - secretRef:
        name: svc-auth-dev-secrets
        optional: true

service:
  ports:
    - name: http
      port: 80
      targetPort: http
      containerPort: 4010

ingress:
  enabled: true
  className: kong
  annotations:
    kubernetes.io/ingress.class: kong
    cert-manager.io/cluster-issuer: letsencrypt-http
  hosts:
    - host: auth.dev.mereb.social
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
  tls:
    - secretName: auth-dev-tls
      hosts:
        - auth.dev.mereb.social

configMap:
  enabled: true
  nameOverride: svc-auth-dev-config
  data:
    PORT: "4010"
    OIDC_ISSUER: https://idp.dev.mereb.social/realms/mereb
    OIDC_AUDIENCE: mereb-dev

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
