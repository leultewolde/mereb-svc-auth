version: 1
preset: node

env:
  SERVICE_DIR: services/svc-auth
  PACKAGE_NAME: "@services/svc-auth"

build:
  stages:
    - name: Bootstrap Node runtime
      sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        mkdir -p .ci

        if command -v node >/dev/null 2>&1; then
          echo "Detected preinstalled Node at $(command -v node)"
          NODE_BIN_DIR="$(dirname "$(command -v node)")"
          printf 'export PATH="%s:$PATH"\n' "${NODE_BIN_DIR}" > .ci/env.sh
          chmod +x .ci/env.sh
          exit 0
        fi

        NODE_VERSION="${NODE_VERSION:-20.19.2}"
        NODE_DIST="node-v${NODE_VERSION}-linux-x64"
        NODE_ARCHIVE="${NODE_DIST}.tar.xz"
        NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}"
        NODE_DIR=".ci/${NODE_DIST}"

        if [ ! -d "${NODE_DIR}" ]; then
          echo "Downloading Node.js ${NODE_VERSION} from ${NODE_URL}"
          curl -fsSL "${NODE_URL}" -o ".ci/${NODE_ARCHIVE}"
          tar -xJf ".ci/${NODE_ARCHIVE}" -C .ci
        fi

        NODE_BIN_DIR="$(pwd)/${NODE_DIR}/bin"
        printf 'export PATH="%s:$PATH"\n' "${NODE_BIN_DIR}" > .ci/env.sh
        chmod +x .ci/env.sh
        echo "Node.js $(. .ci/env.sh && node -v) bootstrapped into ${NODE_DIR}"
    - name: Prepare pnpm
      sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ -f .ci/env.sh ]; then
          . .ci/env.sh
        fi

        if command -v pnpm >/dev/null 2>&1; then
          pnpm --version
          exit 0
        fi

        if command -v corepack >/dev/null 2>&1; then
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
        elif command -v npm >/dev/null 2>&1; then
          npm install -g pnpm@9.0.0
        else
          echo "Neither pnpm, corepack, nor npm are available on this agent." >&2
          exit 1
        fi

        pnpm --version
    - name: Install dependencies
      sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ -f .ci/env.sh ]; then
          . .ci/env.sh
        fi

        PKG_DIR="${SERVICE_DIR:-services/svc-auth}"
        if [ ! -d "${PKG_DIR}" ]; then
          PKG_DIR="."
        fi

        run_install() {
          local lock_path="$1"
          if [ -f "${lock_path}" ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
        }

        if [ -f pnpm-workspace.yaml ]; then
          run_install "pnpm-lock.yaml"
        else
          pushd "${PKG_DIR}" >/dev/null
          run_install "pnpm-lock.yaml"
          popd >/dev/null
        fi
    - name: Lint service sources
      sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ -f .ci/env.sh ]; then
          . .ci/env.sh
        fi

        PKG_DIR="${SERVICE_DIR:-services/svc-auth}"
        if [ ! -d "${PKG_DIR}" ]; then
          PKG_DIR="."
        fi

        if [ -f pnpm-workspace.yaml ]; then
          pnpm --filter "${PACKAGE_NAME}" lint
        else
          pushd "${PKG_DIR}" >/dev/null
          pnpm lint
          popd >/dev/null
        fi
    - name: Build service package
      sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ -f .ci/env.sh ]; then
          . .ci/env.sh
        fi

        PKG_DIR="${SERVICE_DIR:-services/svc-auth}"
        if [ ! -d "${PKG_DIR}" ]; then
          PKG_DIR="."
        fi

        if [ -f pnpm-workspace.yaml ]; then
          pnpm --filter "${PACKAGE_NAME}" build
        else
          pushd "${PKG_DIR}" >/dev/null
          pnpm build
          popd >/dev/null
        fi

image:
  repository: registry.leultewolde.com/mereb/svc-auth
  context: .
  dockerfile: Dockerfile
  tagStrategy: branch-sha
  push:
    enabled: true
    when: '!pr'
    credentialsId: docker-registry-local
    registry: registry.leultewolde.com

deploy:
  order:
    - dev
    - stg
    - prd

  dev:
    release: svc-auth-dev
    namespace: apps-dev
    chart: app-chart
    repo: https://charts.leultewolde.com
    repoCredentialId: helm-chart-creds
    valuesFiles:
      - .ci/values-dev.yaml
    when: branch=main & !pr
    autoPromote: true
    smoke:
      url: https://api-dev.mereb.app/auth/healthz

  stg:
    release: svc-auth-stg
    namespace: apps-stg
    chart: app-chart
    repo: https://charts.leultewolde.com
    repoCredentialId: helm-chart-creds
    valuesFiles:
      - .ci/values-stg.yaml
    when: branch=main & !pr
    autoPromote: true
    approval:
      before: true
      message: "Deploy svc-auth to staging?"
      submitter: release-managers
    smoke:
      url: https://api-stg.mereb.app/auth/healthz

  prd:
    release: svc-auth
    namespace: apps-prd
    chart: app-chart
    repo: https://charts.leultewolde.com
    repoCredentialId: helm-chart-creds
    valuesFiles:
      - .ci/values-prd.yaml
    when: tag=^v[0-9].*
    autoPromote: false
    approval:
      message: "Deploy svc-auth to production?"
      submitter: release-managers
    smoke:
      url: https://api.mereb.app/auth/healthz

signing:
  enabled: false

release:
  autoTag:
    enabled: true
    when: branch=main & !pr
    prefix: v
    bump: patch
    remote: origin
    gitUser: Mereb CI
    gitEmail: ci@mereb.dev
    credentialId: github-credentials
    clean: false
    allowDirty: true
    skipIfTagged: true
    afterEnvironment: stg
  github:
    enabled: true
    when: tag=^v[0-9].*
    repo: leultewolde/mereb-svc-auth
    stageName: GitHub Release
    credentialId: github-credentials
    generateReleaseNotes: true
