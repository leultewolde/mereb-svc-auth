nameOverride: svc-auth

replicaCount: 1

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: registry.leultewolde.com/mereb/svc-auth
  env:
    - name: NODE_ENV
      value: production
    - name: SERVICE_NAME
      value: svc-auth
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-dev.platform-dev.svc.cluster.local:4318
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      value: http/protobuf
    - name: OIDC_ISSUER
      valueFrom:
        configMapKeyRef:
          name: platform-identity-dev
          key: OIDC_ISSUER
    - name: OIDC_AUDIENCE
      valueFrom:
        configMapKeyRef:
          name: platform-identity-dev
          key: ENV_API_AUDIENCE
  envFrom:
    - configMapRef:
        name: svc-auth-dev-config
    - secretRef:
        name: svc-auth-dev-secrets
        optional: false

imagePullSecrets:
  - regcred

vaultSecretsOperator:
  enabled: true
  auth:
    create: true
    spec:
      vaultAuthGlobalRef:
        name: mereb-apps-dev
        namespace: vault-secrets-operator
      kubernetes:
        role: apps-dev-svc-auth
      mount: kubernetes-dev
  staticSecrets:
    - name: svc-auth-runtime
      spec:
        type: kv-v2
        mount: kv
        path: apps/dev
        refreshAfter: 5m
        destination:
          name: svc-auth-dev-secrets
          create: true
          overwrite: true
          transformation:
            excludes:
              - .*
            templates:
              DATABASE_URL:
                text: '{{- get .Secrets "DATABASE_URL" -}}'
              SPLUNK_HEC_TOKEN:
                text: '{{- get .Secrets "SPLUNK_HEC_TOKEN" -}}'
        rolloutRestartTargets:
          - kind: Deployment
            name: svc-auth-dev

service:
  ports:
    - name: http
      port: 80
      targetPort: http
      containerPort: 4010

ingress:
  enabled: true
  className: kong
  annotations:
    kubernetes.io/ingress.class: kong
    cert-manager.io/cluster-issuer: letsencrypt-http
    konghq.com/strip-path: "true"
  hosts:
    - host: api-dev.mereb.app
      paths:
        - path: /auth
          pathType: Prefix
          servicePort: http
  tls:
    - secretName: auth-dev-tls
      hosts:
        - api-dev.mereb.app

configMap:
  enabled: true
  nameOverride: svc-auth-dev-config
  data:
    PORT: "4010"
    SPLUNK_HEC_URL: http://splunk-prd.platform-prd.svc.cluster.local:8088/services/collector/event
    SPLUNK_HEC_INDEX: logs-dev

resources:
  requests:
    cpu: 15m
    memory: 96Mi
  limits:
    cpu: 150m
    memory: 256Mi
