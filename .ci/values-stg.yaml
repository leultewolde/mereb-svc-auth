nameOverride: svc-auth

replicaCount: 1

imagePullSecrets:
  - regcred

image:
  env:
    - name: NODE_ENV
      value: production
    - name: SERVICE_NAME
      value: svc-auth
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: https://otel-collector-stg.mereb.app
  envFrom:
    - configMapRef:
        name: svc-auth-stg-config
    - secretRef:
        name: svc-auth-stg-secrets
        optional: true

# Rendered per deploy from Vault
valuesTemplates:
  - .ci/.rendered/values-stg.secret.yaml

service:
  ports:
    - name: http
      port: 80
      targetPort: http
      containerPort: 4010

ingress:
  enabled: true
  className: kong
  annotations:
    kubernetes.io/ingress.class: kong
    cert-manager.io/cluster-issuer: letsencrypt-http
    konghq.com/strip-path: "true"
  hosts:
    - host: api-stg.mereb.app
      paths:
        - path: /auth
          pathType: Prefix
          servicePort: http
  tls:
    - secretName: auth-stg-tls
      hosts:
        - api-stg.mereb.app

configMap:
  enabled: true
  nameOverride: svc-auth-stg-config
  data:
    PORT: "4010"
    OIDC_ISSUER: https://auth.mereb.app/realms/mereb
    OIDC_AUDIENCE: mereb-stg
    SPLUNK_HEC_URL: http://splunk-stg.platform-stg.svc.cluster.local:8088/services/collector/event
    SPLUNK_HEC_INDEX: logs-stg

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 150m
    memory: 256Mi
